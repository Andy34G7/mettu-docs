site_name: "mettu"
author: "Hemanth Andey"
base_url: "https://mettu-docs.hemanthandey.dev"

theme:
  default: "dim"
  toggle:
    light: "light"
    dark: "dim"
  include:
    - "dim"
    - "light"

fonts:
  imports:
    - "https://fonts.googleapis.com/css2?family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
  families:
    body: "'Red Hat Text', sans-serif"
    heading: "'Red Hat Display', sans-serif"
    mono: "'Google Sans Code', monospace"

syntax:
  pygments_theme: "native"

markdown:
  extensions:
    - fenced_code
    - codehilite
    - footnotes
    - tables
    - attr_list
    - sane_lists
    - md_in_html
    - toc:
        permalink: true

images:
  formats:
    - webp
    - jpg

navigation:
  - name: "Home"
    url: "/"
  - name: "Docs"
    url: "/docs/"
  - name: "Getting Started"
    url: "/docs/getting-started/"
  - name: "Configuration"
    url: "/docs/configuration/"
